name: NyangTracker CI

on:
  pull_request:
  push:
    branches: [main, '냥트랙커']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run usage collector tests
        run: npm test
      - name: Build renderer
        run: npm run build
