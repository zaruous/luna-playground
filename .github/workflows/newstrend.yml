name: NewsTrend CI and Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: newstrend-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.story_count.outputs.deploy_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test feed parser
        run: npm test
      - name: Refresh today's news
        run: npm run news:refresh
      - name: Evaluate story count
        id: story_count
        run: |
          count=$(node -e "const d=require('./src/data/news.json'); process.stdout.write(String(d.items.length))")
          echo "stories=$count"
          if [ "$count" -ge 10 ] && [ "$count" -le 20 ]; then
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "NewsTrend: keeping the last successful Pages deployment because only $count same-day stories are available."
          fi
      - name: Build React site
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.story_count.outputs.deploy_ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
